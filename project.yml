# Source of truth for the Xcode project. Regenerate with `xcodegen generate`
# after adding or moving files. The generated .xcodeproj is committed so that
# Xcode Cloud and contributors without XcodeGen can build without extra setup.
name: DaGym
options:
  bundleIdPrefix: dev.abdirahmanmohamed
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2660"

packages:
  # All training math and logic. No UI, no SwiftData, so `swift test` runs it
  # without a simulator.
  GymCore:
    path: GymCore

configs:
  Debug: debug
  Release: release

settings:
  base:
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Warnings are errors. There is no legacy code to grandfather.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    # Team "Abdirahman Mohamed", so Xcode and Xcode Cloud resolve signing
    # without a dropdown.
    DEVELOPMENT_TEAM: 5AF2LBU5A3

targets:
  DaGym:
    type: application
    platform: iOS
    sources:
      - path: DaGym
        # The photographs come in as ONE folder reference below, not as ~1,400 individual file
        # references, so they are copied into the bundle verbatim under ExercisePhotos/ and
        # loaded by path (DaGym/Design/Components/ExercisePhotoView.swift). Deliberately not an
        # .xcassets catalogue: catalogue membership makes Xcode rasterise every member at
        # several scales, which is how 516 SVGs once turned a 28 KB Assets.car into 52 MB.
        excludes:
          - Resources/ExercisePhotos
      - path: DaGym/Resources/ExercisePhotos
        type: folder
    dependencies:
      - package: GymCore
        product: GymCore
      - target: DaGymWidgets
        embed: true
    info:
      path: DaGym/Info.plist
      properties:
        CFBundleDisplayName: DaGym
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Standard HTTPS only, which is exempt. Without this, App Store Connect
        # asks an encryption question on every build.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Automatic
        # Rest-timer Live Activity (Lock Screen + Dynamic Island). No entitlement needed for a
        # foreground-started Live Activity; push-to-start is out of scope for now (see plan §6.2).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        # Apple Health (plan.md §6.8): bodyweight/body-composition history, workout write-back
        # (with an opt-in calorie estimate), imported external workouts, and read-only recovery
        # signals (HRV/RHR/sleep, P6). Plain-language, no medical claims.
        # The "stays on this iPhone" claim is load-bearing, and enforced by the code: everything
        # read out of Health is either used live (bodyweight, body composition, recovery) or kept
        # in the separate always-local store (`ModelContainer.dagymHealth`, imported workouts),
        # never the CloudKit-mirrored main store. App Store Guideline 5.1.3 forbids putting
        # HealthKit data in iCloud, so these two strings and that split have to stay in step.
        NSHealthShareUsageDescription: >-
          DaGym reads your bodyweight, body fat percentage, lean body mass, height, heart-rate
          variability, resting heart rate, sleep and workouts logged in other apps to personalise
          training suggestions and fill in your Body screen. What DaGym reads from Health stays on
          this iPhone — it is never copied to iCloud or sent to a server.
        NSHealthUpdateUsageDescription: >-
          DaGym saves your strength workouts and bodyweight to Apple Health, plus an active-energy
          estimate only if you turn that on in Settings. Deleting a workout in DaGym deletes the
          one it wrote to Health too.
        # Voice logging (plan.md §6.5): recognition runs on-device only — the recogniser is
        # configured with requiresOnDeviceRecognition, so no audio and no transcript leaves the
        # phone. Both strings say so, because that is the whole reason a lifter would allow it.
        NSMicrophoneUsageDescription: >-
          DaGym uses the microphone so you can log sets by voice mid-workout. Audio is processed
          entirely on your device and never leaves it.
        NSSpeechRecognitionUsageDescription: >-
          DaGym uses on-device speech recognition to turn what you say into a logged set. Nothing
          is sent to a server.
        # Calendar sync (plan.md §6.8): write-only access is enough — DaGym only creates,
        # updates and deletes events in its own "DaGym" calendar, never reads the user's other
        # events.
        CFBundleURLTypes:
          - CFBundleURLName: dev.abdirahmanmohamed.dagym
            CFBundleURLSchemes: [dagym]
        # Shareable routine/program files (plan.md §6.8): a `.gymplan` is JSON under the hood, so
        # it conforms to public.json — opening one from Messages/AirDrop/Files launches DaGym via
        # `RootView.onOpenURL`, which hands the file URL to `PlanImportPreviewSheet`.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.abdirahmanmohamed.dagym.plan
            UTTypeConformsTo: [public.json]
            UTTypeDescription: DaGym Plan
            UTTypeTagSpecification:
              public.filename-extension: [gymplan]
        CFBundleDocumentTypes:
          - CFBundleTypeName: DaGym Plan
            LSItemContentTypes: [dev.abdirahmanmohamed.dagym.plan]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          DaGym adds your scheduled workouts to a "DaGym" calendar so they show up alongside
          the rest of your day.
        # Progress photos (plan.md §6.4): in-app capture with a ghost overlay of the previous
        # shot, or picking an existing photo. Photos stay in a local-only store by default (see
        # `Preferences.syncPhotos`, `ModelContainer.dagym`) and can be gated behind Face ID.
        NSCameraUsageDescription: >-
          DaGym uses the camera to take progress photos, lined up with your previous shot, and to
          scan your gym membership card.
        NSPhotoLibraryUsageDescription: >-
          DaGym can use an existing photo from your library as a progress photo.
        NSFaceIDUsageDescription: >-
          DaGym can lock your progress photos behind Face ID.
        # iCloud sync (plan.md §6.3): SwiftData + CloudKit private database, App Group so the
        # widgets extension can read the on-device snapshot without opening the store.
        UIBackgroundModes:
          - remote-notification
        UIAppFonts:
          - Barlow-Regular.ttf
          - Barlow-Medium.ttf
          - Barlow-SemiBold.ttf
          - Barlow-Bold.ttf
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBold.ttf
    # HealthKit + CloudKit + App Group entitlements share this one block — coordinate inside it
    # rather than adding a second `entitlements:` key.
    entitlements:
      path: DaGym/DaGym.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Background delivery (plan.md §6.8, `HealthKitStore.observeWorkoutChanges`): lets
        # HKObserverQuery wake DaGym when a workout sample lands outside the app, so a session
        # logged on the Watch can be imported without the user opening Settings. Only registered
        # when the user has opted into automatic import (`Preferences.healthAutoImportWorkouts`),
        # and registered from `DaGymAppDelegate` because a HealthKit background launch renders no
        # scenes. NOTE: this is a new capability grant — Xcode's "HealthKit" capability
        # must have "Background Delivery" checked (or this entitlement re-added if it's ever
        # stripped by a manual signing pass), and it changes the provisioning profile: a profile
        # regenerated/downloaded before this change won't have it.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.dev.abdirahmanmohamed.dagym
        com.apple.security.application-groups:
          - group.dev.abdirahmanmohamed.dagym
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.dagym
        PRODUCT_NAME: DaGym
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only. No iPad or Mac targets, by decision.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Localization scaffolding (Phase 8): String Catalog wiring so `String(localized:)` and
        # SwiftUI's automatic string extraction resolve through DaGym/Resources/Localizable.xcstrings.
        LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  DaGymTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaGymTests
    dependencies:
      - target: DaGym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.dagym.tests
        GENERATE_INFOPLIST_FILE: YES

  DaGymUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaGymUITests
    dependencies:
      - target: DaGym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.dagym.uitests
        GENERATE_INFOPLIST_FILE: YES

  # Widget extension: the rest-timer Live Activity (Lock Screen + Dynamic Island). Embedded into
  # DaGym via that target's `dependencies`. `RestActivityAttributes.swift` and `RestIntents.swift`
  # are shared source files, also compiled into DaGym itself — see those targets' `sources`.
  DaGymWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DaGymWidgets
      - path: DaGym/Features/LiveActivity/RestActivityAttributes.swift
      - path: DaGym/App/Intents/RestIntents.swift
      - path: DaGym/App/Intents/StartRestTimerIntent.swift
      - path: DaGym/Features/Widgets/WidgetSnapshot.swift
    dependencies:
      - package: GymCore
        product: GymCore
    info:
      path: DaGymWidgets/Info.plist
      properties:
        CFBundleDisplayName: DaGym Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBold.ttf
    resources:
      - path: DaGym/Resources/Fonts/BarlowCondensed-Bold.ttf
      - path: DaGym/Resources/Fonts/BarlowCondensed-ExtraBold.ttf
    # App Group only: the widgets extension needs it to read `WidgetSnapshot` from shared
    # UserDefaults (see DaGym/Features/Widgets/WidgetSnapshotWriter.swift). No CloudKit
    # entitlement here — the widget never opens the SwiftData store directly.
    entitlements:
      path: DaGymWidgets/DaGymWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.abdirahmanmohamed.dagym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.dagym.widgets
        PRODUCT_NAME: DaGymWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  # Standalone Apple Watch app. Not yet embedded in the iOS app: that wiring
  # lands with Phase 5 (watch), so the iOS build never waits on a watchOS
  # simulator runtime until the watch app has something to show.
  DaGymWatch:
    type: application
    platform: watchOS
    sources:
      - path: DaGymWatch
    dependencies:
      - package: GymCore
        product: GymCore
    info:
      path: DaGymWatch/Info.plist
      properties:
        CFBundleDisplayName: DaGym
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: dev.abdirahmanmohamed.dagym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.dagym.watchkitapp
        PRODUCT_NAME: DaGym
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  DaGym:
    build:
      targets:
        DaGym: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # The unit-test host launches with this flag so it stays inert (no CloudKit, seeding,
      # HealthKit or notifications) and the runner connects instantly. XCUITest launches
      # the app itself with its own arguments, so this does not affect UI tests.
      commandLineArguments:
        "-dgTestHost": true
      targets:
        - DaGymTests
        - DaGymUITests
        - package: GymCore/GymCoreTests
    archive:
      config: Release

  DaGymWatch:
    build:
      targets:
        DaGymWatch: all
    run:
      config: Debug
    archive:
      config: Release
