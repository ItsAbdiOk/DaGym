# Lint rules for DaGym. Violations are errors: they break the build rather
# than accumulating quietly.

included:
  - DaGym
  - DaGymTests
  - DaGymUITests
  - DaGymWatch
  - DaGymWatchTests
  - DaGymWidgets
  - GymCore/Sources
  - GymCore/Tests

excluded:
  - DaGym.xcodeproj
  - .build
  - GymCore/.build
  # Vendored third-party code (see DaGym/Vendor/MuscleMap/LICENSE, and THIRD-PARTY.md for
  # the vendoring changes) — kept close to upstream and not reformatted to our rules. The
  # only edits are a `Muscle` -> `MMMuscle` rename and the removal of the `Bundle.module`-
  # backed members; each file's header records them.
  - DaGym/Vendor

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_over_fileprivate
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

# No analyzer_rules: they only run under `swiftlint analyze --compiler-log-path`, which needs a
# full xcodebuild log and re-parses every file through SourceKit (minutes for ~650 files),
# and every gate here runs `swiftlint lint`. Listing `unused_import` implied it was enforced.

# Nothing a user types or a network returns may be force-unwrapped.
force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error
implicitly_unwrapped_optional:
  severity: error

line_length:
  warning: 110
  error: 140
  ignores_comments: false
  ignores_urls: true

type_body_length:
  warning: 250
  error: 400
function_body_length:
  warning: 60
  error: 100
file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

# Configured rather than `swiftlint:disable`d inline: three-element tuples are the fixture
# shape the tests use; four is where a struct earns its name.
large_tuple:
  warning: 3
  error: 4

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded: [id, x, y, w, r, t, p]

nesting:
  type_level: 2

custom_rules:
  no_print_statements:
    name: "print() in shipping code"
    regex: '(?<!\/\/\s)\bprint\('
    match_kinds: [identifier]
    message: "Use a logger, not print(). print() is invisible in a TestFlight build."
    severity: error

  no_hardcoded_api_key:
    name: "Hard-coded API key"
    # BYO-key mode stores the user's key in the Keychain at runtime. A key
    # literal in source would ship to everyone.
    regex: '"(sk-ant-|sk-|AIza)[A-Za-z0-9_\-]{12,}"'
    excluded: ".*Tests?\\.swift"
    message: "Never hard-code an API key. Keys live in the Keychain, entered by the user."
    severity: error

  no_inline_formatter:
    name: "Formatter built per call"
    # A DateFormatter/NumberFormatter costs milliseconds to construct; inside `body` or a
    # helper it is rebuilt on every render. Hoist it to a `static let` — the one form allowed:
    # the two look-behinds accept `static let f = DateFormatter()` and the closure form
    # (`static let f: DateFormatter = {` on the line above). Look-behinds must be bounded, hence
    # the {0,120}; a line longer than that is already a line_length error.
    regex: '(?<!static (let|var)[^\n]{0,120})(?<!static (let|var)[^\n]{0,120}\n[^\n]{0,120})\b((ISO8601)?DateFormatter|NumberFormatter)\(\)'
    included: "DaGym/(Features|Design)/.*\\.swift"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Don't construct a formatter inline; hoist it to a `private static let` in this file."
    severity: error

  no_wall_clock_in_core:
    name: "Wall clock in GymCore"
    # GymCore is pure: callers pass `now:` and `calendar:` so tests pin them. A default
    # parameter value (`now: Date = Date()`) is that injection point and is allowed.
    regex: '(?<!:\s{0,3}Date\s{0,3}=\s{0,3})\bDate\(\)|\bCalendar\.current\b'
    included: "GymCore/Sources/.*\\.swift"
    excluded_match_kinds: [comment, doccomment, string]
    message: "GymCore takes `now:`/`calendar:` parameters; never read the wall clock here."
    severity: error

  no_todo_without_owner:
    name: "Bare TODO"
    regex: '(TODO|FIXME)(?!\s*\(\w)'
    message: "TODO/FIXME must name an issue or owner, e.g. TODO(#12): ..."
    severity: warning

reporter: "xcode"
